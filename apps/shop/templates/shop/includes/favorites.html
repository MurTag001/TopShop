{% load static %}
<link rel="stylesheet" href="{% static 'shop/css/includes/favorites.css' %}">

{% if request.user.is_authenticated %}
  <button class="favorite-btn {% if request.user in product.favorites.all %}is-favorite{% endif %}" 
          data-id="{{ product.id }}" 
          type="button">
    
    <!-- SVG для закрашенного сердечка -->
    <svg xmlns="http://w3.org" width="18" height="18" fill="currentColor" class="bi bi-heart-fill heart-icon-filled" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
    </svg>

    <!-- SVG для пустого сердечка -->
    <svg xmlns="http://w3.org" width="18" height="18" fill="currentColor" class="bi bi-heart heart-icon-empty" viewBox="0 0 16 16">
      <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01z"/>
    </svg>

    {% csrf_token %}
  </button>
{% else %}
  <a href="{% url 'users:login' %}" class="favorite-btn">
    <svg xmlns="http://w3.org" width="18" height="18" fill="currentColor" class="bi bi-heart heart-icon-empty" viewBox="0 0 16 16">
      <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01z"/>
    </svg>
  </a>
{% endif %}
