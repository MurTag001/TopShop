{% extends "shop/base.html" %}

{% block page_title %}
  TopShop | Добавить позицию
{% endblock page_title %}

{% block page_content %}
  <h1>Новый товар</h1>

  <form method="POST">
    {% csrf_token %}

    <div>
      <label for="titleInput">Наименование:</label>
      <input
        id="titleInput"
        name="name"
        type="text"
        placeholder="Максимальная длина 200 символов"
        required
      >
    </div>

    <div>
      <label for="textInput">Описание:</label>
      <textarea id="textInput" name="description" rows="3"></textarea>
    </div>

    <div>
      <label for="priceInput">Цена:</label>
      <input
        id="priceInput"
        name="price"
        type="number"
        step="0.01"
        min="0"
        placeholder="0.00"
        required
      >
    </div>

    <div>
      <label for="stockInput">Количество на складе:</label>
      <input
        id="stockInput"
        name="stock"
        type="number"
        min="0"
        placeholder="0"
        required
      >
    </div>

    <button type="submit">Добавить</button>
  </form>
{% endblock page_content %}
